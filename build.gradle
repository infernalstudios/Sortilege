plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "TerraformersMC"
                url "https://maven.terraformersmc.com/"
            }
        }
        filter {
            includeGroup "dev.emi"
            includeGroup "com.terraformersmc"
        }
    }

    maven {
        name = "Modrinth"
        url "https://api.modrinth.com/maven"
    }
    maven {
        name = "Curseforge"
        url "https://cursemaven.com"
    }
}

base {
    archivesName = 'Sortilege-Neo-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run')

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "maven.modrinth:sollib:${sollib_version}"
    implementation "maven.modrinth:emi:${emi_version}"

    // Staff dependencies
    // Spell Engine
    compileOnly "maven.modrinth:spell-engine:1.10.9+1.21.1-neoforge"
    compileOnly "maven.modrinth:spell-power:1.6.0+1.21.1-neoforge"
    compileOnly "curse.maven:rpgmana-1021902:8831226"
    // Goety
    compileOnly "maven.modrinth:goety:3.2.0"
    // Caverns & Chasms
    compileOnly "maven.modrinth:caverns-and-chasms:3.0.1"
    // Iron's Spells
    compileOnly "maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3"
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
