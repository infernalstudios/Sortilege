plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'ParchmentMC'
		url 'https://maven.parchmentmc.org'
	}

	maven {
		name = "JitpackASM"
		url 'https://jitpack.io'
	}

	maven {
		name = "TerraformersMC"
		url "https://maven.terraformersmc.com/"
	}

	// owo
	maven {
		name = 'WispForest'
		url 'https://maven.wispforest.io/releases/'
	}

	// Botania needs these
	maven {
		name = "BlameJared"
		url 'https://maven.blamejared.com'
	}
	maven {
		name = "JamiesWhiteShirt"
		url "https://maven.jamieswhiteshirt.com/libs-release"
	}
	maven {
		name = "Ladysnake Libs"
		url 'https://maven.ladysnake.org/releases'
	}

	// ClothConfig (for Origins)
	maven {
		name = "Shedaniel"
		url "https://maven.shedaniel.me/"
	}

	maven {
		name = "Modrinth"
		url "https://api.modrinth.com/maven"
	}
	maven {
		name = "Curseforge"
		url "https://cursemaven.com"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fabric ASM
	modImplementation "com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}"
	include "com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}"

	// Sol
	modImplementation "maven.modrinth:sollib:fabric-1.20.1-1.1"

	// EMI
	modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
	modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
	modLocalRuntime "maven.modrinth:emi-plus-backport:tbcT7hXz"
	modLocalRuntime "net.fabricmc:fabric-language-kotlin:1.13.9+kotlin.2.3.10"
	modLocalRuntime "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"

	// ModMenu
	modLocalRuntime "com.terraformersmc:modmenu:7.2.2"

	// So many staff type dependencies ._.
	// Botania
	modCompileOnly "vazkii.botania:Botania:1.20.1-453-FABRIC"
	// Feathers
	modCompileOnly "curse.maven:feathers-699933:4814309"
	// Electroblob
	modCompileOnly "maven.modrinth:electroblobs-wizardry-redux:0.8.5.1-fabric"
	// Affinity
	modCompileOnly "maven.modrinth:affinity:0.1.8+1.20"
	modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"
	modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"
	modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-chunk:5.2.3"
	// Spell Engine
	modCompileOnly "maven.modrinth:spell-engine:0.15.12+1.20.1"
	modCompileOnly "maven.modrinth:spell-power:0.12.0+1.20.1"
	modCompileOnly "curse.maven:rpgmana-1021902:6204209"
	// Origins
	modCompileOnly "com.github.apace100:origins-fabric:v1.10.1"
	// Goety
	modCompileOnly "maven.modrinth:goety-fabric:0.3.5-forge2.5.54.5+mc1.20.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
